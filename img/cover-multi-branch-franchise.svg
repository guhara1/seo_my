<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: a hub-and-spoke internal linking model connecting a central locations page to individual branch pages">
  <defs>
    <linearGradient id="bgfade15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade15)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Hub-and-spoke: one brand, many branch pages</text>

    <!-- spokes -->
    <g stroke="rgba(203,242,74,0.35)" stroke-width="2" fill="none">
      <line x1="600" y1="337" x2="330" y2="180"/>
      <line x1="600" y1="337" x2="600" y2="150"/>
      <line x1="600" y1="337" x2="870" y2="180"/>
      <line x1="600" y1="337" x2="330" y2="500"/>
      <line x1="600" y1="337" x2="600" y2="530"/>
      <line x1="600" y1="337" x2="870" y2="500"/>
    </g>

    <!-- hub -->
    <g transform="translate(600,337)">
      <circle r="70" fill="rgba(203,242,74,0.14)" stroke="#CBF24A" stroke-width="2"/>
      <text y="-4" text-anchor="middle" font-size="14" font-weight="700" fill="#CBF24A">Locations</text>
      <text y="16" text-anchor="middle" font-size="11" fill="#B9BEB6">hub page</text>
    </g>

    <!-- branch nodes -->
    <g font-size="12" fill="#E9EAE3">
      <g transform="translate(330,180)"><circle r="46" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-2" text-anchor="middle">Bangsar</text><text y="16" text-anchor="middle" font-size="10" fill="#8E978C">branch</text></g>
      <g transform="translate(600,150)"><circle r="46" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-2" text-anchor="middle">Petaling</text><text y="16" text-anchor="middle" font-size="10" fill="#8E978C">Jaya branch</text></g>
      <g transform="translate(870,180)"><circle r="46" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-2" text-anchor="middle">Penang</text><text y="16" text-anchor="middle" font-size="10" fill="#8E978C">branch</text></g>
      <g transform="translate(330,500)"><circle r="46" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-2" text-anchor="middle">Johor</text><text y="16" text-anchor="middle" font-size="10" fill="#8E978C">Bahru branch</text></g>
      <g transform="translate(600,530)"><circle r="46" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-2" text-anchor="middle">Ipoh</text><text y="16" text-anchor="middle" font-size="10" fill="#8E978C">branch</text></g>
      <g transform="translate(870,500)"><circle r="46" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-2" text-anchor="middle">Melaka</text><text y="16" text-anchor="middle" font-size="10" fill="#8E978C">branch</text></g>
    </g>

    <text x="600" y="620" text-anchor="middle" font-size="12.5" fill="#6B736A">Each branch page: unique local content + its own LocalBusiness schema — never a swapped-address template.</text>
  </g>

  <text x="80" y="655" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — SEO for multi-branch &amp; franchise businesses in Malaysia</text>
</svg>
