<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: multilingual keyword research for Malaysia — three search bars in English, Bahasa Malaysia and Chinese showing different real search phrasing for the same product">
  <defs>
    <linearGradient id="bgfade7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade7)"/>

  <g font-family="Archivo, sans-serif">
    <text x="90" y="80" font-size="15" fill="#8E978C">Same product. Three different searches.</text>

    <!-- EN search bar -->
    <g transform="translate(90,110)">
      <rect width="1020" height="140" rx="18" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
      <rect x="24" y="24" width="60" height="26" rx="13" fill="rgba(203,242,74,0.14)"/>
      <text x="54" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#CBF24A">EN</text>
      <rect x="24" y="64" width="700" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(232,233,227,0.14)"/>
      <text x="46" y="90" font-size="18" fill="#E9EAE3">waterproof running shoes for rain</text>
      <text x="760" y="90" font-size="13" fill="#6B736A">2,900 / mo</text>
    </g>

    <!-- BM search bar -->
    <g transform="translate(90,268)">
      <rect width="1020" height="140" rx="18" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
      <rect x="24" y="24" width="60" height="26" rx="13" fill="rgba(203,242,74,0.14)"/>
      <text x="54" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#CBF24A">BM</text>
      <rect x="24" y="64" width="700" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(232,233,227,0.14)"/>
      <text x="46" y="90" font-size="18" fill="#E9EAE3">kasut sukan tahan hujan</text>
      <text x="760" y="90" font-size="13" fill="#6B736A">4,400 / mo</text>
    </g>

    <!-- ZH search bar -->
    <g transform="translate(90,426)">
      <rect width="1020" height="140" rx="18" fill="#161B17" stroke="rgba(203,242,74,0.3)"/>
      <rect x="24" y="24" width="60" height="26" rx="13" fill="rgba(203,242,74,0.14)"/>
      <text x="54" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#CBF24A">中文</text>
      <rect x="24" y="64" width="700" height="42" rx="21" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.3)"/>
      <text x="46" y="90" font-size="18" fill="#E9EAE3">防水跑步鞋 推荐</text>
      <text x="760" y="90" font-size="13" fill="#CBF24A" font-weight="700">6,100 / mo — highest volume</text>
    </g>
  </g>

  <text x="90" y="605" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — multilingual keyword research, Malaysia (illustrative volumes)</text>
</svg>
