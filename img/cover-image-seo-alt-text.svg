<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic comparing a bad image filename and alt text against a good one, side by side, with real file-size compression numbers">
  <defs>
    <linearGradient id="bgfade18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade18)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Same photo, two very different outcomes</text>

    <!-- bad example -->
    <g transform="translate(80,100)">
      <rect width="480" height="440" rx="16" fill="#161B17" stroke="rgba(232,74,74,0.3)"/>
      <text x="240" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#E88484">✕ BEFORE</text>
      <rect x="24" y="60" width="432" height="200" rx="10" fill="rgba(232,233,227,0.05)"/>
      <text x="240" y="165" text-anchor="middle" font-size="40" fill="rgba(232,233,227,0.15)">📷</text>
      <rect x="24" y="276" width="432" height="40" rx="8" fill="rgba(232,74,74,0.08)"/>
      <text x="36" y="300" font-size="12" font-family="monospace" fill="#E88484">IMG_4821.jpg — 6.2MB</text>
      <rect x="24" y="326" width="432" height="60" rx="8" fill="rgba(232,74,74,0.08)"/>
      <text x="36" y="348" font-size="11" fill="#E88484">alt="SEO Malaysia best SEO agency</text>
      <text x="36" y="366" font-size="11" fill="#E88484">Kuala Lumpur SEO services"</text>
      <text x="240" y="420" text-anchor="middle" font-size="11" fill="#8E978C">slow to load, means nothing to a screen reader</text>
    </g>

    <!-- good example -->
    <g transform="translate(640,100)">
      <rect width="480" height="440" rx="16" fill="#161B17" stroke="rgba(203,242,74,0.35)"/>
      <text x="240" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#CBF24A">✓ AFTER</text>
      <rect x="24" y="60" width="432" height="200" rx="10" fill="rgba(203,242,74,0.08)"/>
      <text x="240" y="165" text-anchor="middle" font-size="40" fill="rgba(203,242,74,0.3)">📷</text>
      <rect x="24" y="276" width="432" height="40" rx="8" fill="rgba(203,242,74,0.1)"/>
      <text x="36" y="300" font-size="12" font-family="monospace" fill="#CBF24A">kl-office-team-meeting.webp — 480KB</text>
      <rect x="24" y="326" width="432" height="60" rx="8" fill="rgba(203,242,74,0.1)"/>
      <text x="36" y="348" font-size="11" fill="#B9BEB6">alt="NEXT SEO24 team reviewing a</text>
      <text x="36" y="366" font-size="11" fill="#B9BEB6">client's Search Console report"</text>
      <text x="240" y="420" text-anchor="middle" font-size="11" fill="#8E978C">92% smaller, genuinely describes the image</text>
    </g>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — Image SEO in practice: alt text, file names &amp; the 2026 preferred-image update</text>
</svg>
