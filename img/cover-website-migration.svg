<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: website migration SEO checklist — old URLs mapped to new URLs with 301 redirects">
  <defs>
    <linearGradient id="bgfade4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade4)"/>

  <g font-family="Archivo, sans-serif">
    <!-- old site column -->
    <g transform="translate(90,110)">
      <rect width="330" height="455" rx="18" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
      <text x="24" y="42" font-weight="700" font-size="16" fill="#8E978C">OLD SITE</text>
      <g font-size="14" fill="#B9BEB6">
        <rect x="24" y="66" width="282" height="34" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="36" y="88">/product.php?id=42</text>
        <rect x="24" y="112" width="282" height="34" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="36" y="134">/cat/shoes/index.html</text>
        <rect x="24" y="158" width="282" height="34" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="36" y="180">/blog/post-1.html</text>
        <rect x="24" y="204" width="282" height="34" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="36" y="226">/contact-us.php</text>
        <rect x="24" y="250" width="282" height="34" rx="8" fill="rgba(255,255,255,0.05)"/>
        <text x="36" y="272">/about.php</text>
      </g>
      <rect x="24" y="400" width="282" height="34" rx="17" fill="rgba(233,87,63,0.12)" stroke="rgba(233,87,63,0.3)"/>
      <text x="165" y="422" text-anchor="middle" font-size="12" fill="#F0B3A6">312 URLs total</text>
    </g>

    <!-- arrows with 301 -->
    <g stroke="#CBF24A" stroke-width="3" fill="none">
      <path d="M420 150 h150" marker-end="url(#arrow)"/>
      <path d="M420 196 h150" marker-end="url(#arrow)"/>
      <path d="M420 242 h150" marker-end="url(#arrow)"/>
      <path d="M420 288 h150" marker-end="url(#arrow)"/>
      <path d="M420 334 h150" marker-end="url(#arrow)"/>
    </g>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#CBF24A"/>
      </marker>
    </defs>
    <g font-size="12" font-weight="700" fill="#CBF24A">
      <rect x="450" y="130" width="60" height="24" rx="12" fill="rgba(203,242,74,0.12)"/>
      <text x="480" y="146" text-anchor="middle">301</text>
      <rect x="450" y="176" width="60" height="24" rx="12" fill="rgba(203,242,74,0.12)"/>
      <text x="480" y="192" text-anchor="middle">301</text>
      <rect x="450" y="222" width="60" height="24" rx="12" fill="rgba(203,242,74,0.12)"/>
      <text x="480" y="238" text-anchor="middle">301</text>
      <rect x="450" y="268" width="60" height="24" rx="12" fill="rgba(203,242,74,0.12)"/>
      <text x="480" y="284" text-anchor="middle">301</text>
      <rect x="450" y="314" width="60" height="24" rx="12" fill="rgba(203,242,74,0.12)"/>
      <text x="480" y="330" text-anchor="middle">301</text>
    </g>

    <!-- new site column -->
    <g transform="translate(600,110)">
      <rect width="330" height="455" rx="18" fill="#161B17" stroke="rgba(203,242,74,0.3)"/>
      <text x="24" y="42" font-weight="700" font-size="16" fill="#CBF24A">NEW SITE</text>
      <g font-size="14" fill="#E9EAE3">
        <rect x="24" y="66" width="282" height="34" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="36" y="88">/shoes/product-42</text>
        <rect x="24" y="112" width="282" height="34" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="36" y="134">/shoes</text>
        <rect x="24" y="158" width="282" height="34" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="36" y="180">/blog/post-1</text>
        <rect x="24" y="204" width="282" height="34" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="36" y="226">/contact</text>
        <rect x="24" y="250" width="282" height="34" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="36" y="272">/about</text>
      </g>
      <rect x="24" y="400" width="282" height="34" rx="17" fill="rgba(203,242,74,0.12)" stroke="rgba(203,242,74,0.3)"/>
      <text x="165" y="422" text-anchor="middle" font-size="12" fill="#CBF24A">312 of 312 mapped</text>
    </g>
  </g>

  <text x="90" y="620" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — website migration SEO checklist, redirect mapping</text>
</svg>
