<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: e-commerce SEO in Malaysia — comparing a marketplace shop listing on Shopee or Lazada with an owned website product page">
  <defs>
    <linearGradient id="bgfade6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade6)"/>

  <g font-family="Archivo, sans-serif">
    <!-- marketplace phone mockup -->
    <g transform="translate(150,90)">
      <rect width="300" height="480" rx="28" fill="#161B17" stroke="rgba(232,233,227,0.14)"/>
      <rect x="16" y="20" width="268" height="30" rx="8" fill="rgba(255,120,60,0.14)"/>
      <text x="30" y="40" font-size="13" fill="#FF9466" font-weight="700">Marketplace App</text>
      <rect x="16" y="64" width="268" height="150" rx="12" fill="rgba(255,255,255,0.06)"/>
      <text x="150" y="145" text-anchor="middle" font-size="34" fill="#6b736a">📦</text>
      <text x="30" y="238" font-size="14" fill="#E9EAE3" font-weight="600">Men's Running Shoes</text>
      <text x="30" y="260" font-size="16" fill="#CBF24A" font-weight="700">RM 89.00</text>
      <text x="30" y="282" font-size="12" fill="#8E978C">★ 4.8 (2,341 sold)</text>
      <rect x="16" y="304" width="268" height="34" rx="10" fill="rgba(255,120,60,0.16)"/>
      <text x="150" y="326" text-anchor="middle" font-size="12" fill="#FF9466" font-weight="700">Sponsored — Boost RM 0.60/click</text>
      <rect x="16" y="352" width="268" height="90" rx="10" fill="rgba(255,255,255,0.04)"/>
      <text x="30" y="374" font-size="12" fill="#8E978C">You control: title, photos, price</text>
      <text x="30" y="396" font-size="12" fill="#8E978C">Platform controls: ranking, fees,</text>
      <text x="30" y="414" font-size="12" fill="#8E978C">customer data, algorithm</text>
    </g>

    <!-- vs -->
    <text x="600" y="345" text-anchor="middle" font-size="28" font-weight="800" fill="#4f564e">VS</text>

    <!-- own website mockup -->
    <g transform="translate(750,90)">
      <rect width="300" height="480" rx="18" fill="#161B17" stroke="rgba(203,242,74,0.3)"/>
      <rect x="0" y="0" width="300" height="34" rx="18" fill="#0E120F"/>
      <circle cx="20" cy="17" r="5" fill="#ff5f56"/><circle cx="36" cy="17" r="5" fill="#ffbd2e"/><circle cx="52" cy="17" r="5" fill="#27c93f"/>
      <text x="150" y="22" text-anchor="middle" font-size="10" fill="#8E978C">yourshop.com.my</text>
      <rect x="16" y="50" width="268" height="150" rx="12" fill="rgba(203,242,74,0.06)"/>
      <text x="150" y="131" text-anchor="middle" font-size="34" fill="#CBF24A">📦</text>
      <text x="30" y="224" font-size="14" fill="#E9EAE3" font-weight="600">Men's Running Shoes — KL</text>
      <text x="30" y="246" font-size="16" fill="#CBF24A" font-weight="700">RM 89.00</text>
      <text x="30" y="268" font-size="12" fill="#8E978C">Product schema · reviews · FAQ</text>
      <rect x="16" y="290" width="268" height="34" rx="10" fill="rgba(203,242,74,0.14)" stroke="rgba(203,242,74,0.3)"/>
      <text x="150" y="312" text-anchor="middle" font-size="12" fill="#CBF24A" font-weight="700">Ranking organically — RM 0/click</text>
      <rect x="16" y="338" width="268" height="104" rx="10" fill="rgba(255,255,255,0.04)"/>
      <text x="30" y="360" font-size="12" fill="#8E978C">You control: everything, incl.</text>
      <text x="30" y="382" font-size="12" fill="#8E978C">ranking factors, customer data,</text>
      <text x="30" y="404" font-size="12" fill="#8E978C">email list, repeat-purchase flow</text>
    </g>
  </g>

  <text x="150" y="612" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — e-commerce SEO Malaysia: marketplace vs owned website</text>
</svg>
