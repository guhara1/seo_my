<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: E-E-A-T author trust signals — an author bio card with credentials, verified badge and structured data">
  <defs>
    <linearGradient id="bgfade8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade8)"/>

  <g font-family="Archivo, sans-serif">
    <!-- author card -->
    <g transform="translate(300,90)">
      <rect width="600" height="330" rx="20" fill="#161B17" stroke="rgba(203,242,74,0.3)"/>
      <circle cx="90" cy="90" r="46" fill="rgba(203,242,74,0.16)"/>
      <text x="90" y="100" text-anchor="middle" font-size="30" font-weight="800" fill="#CBF24A">NS</text>
      <text x="156" y="72" font-size="22" font-weight="700" fill="#E9EAE3">[Author Name]</text>
      <text x="156" y="98" font-size="14" fill="#8E978C">[Job title], [Company]</text>
      <g transform="translate(156,116)">
        <rect width="150" height="26" rx="13" fill="rgba(203,242,74,0.14)"/>
        <text x="75" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#CBF24A">✓ Verified author</text>
      </g>
      <line x1="40" y1="176" x2="560" y2="176" stroke="rgba(232,233,227,0.10)"/>
      <text x="40" y="206" font-size="13" fill="#8E978C">Years of relevant, specific experience</text>
      <text x="40" y="232" font-size="13" fill="#8E978C">Real credentials · verifiable track record</text>
      <text x="40" y="258" font-size="13" fill="#8E978C">LinkedIn · published work · verifiable identity</text>
      <rect x="40" y="284" width="520" height="30" rx="8" fill="rgba(255,255,255,0.05)"/>
      <text x="52" y="304" font-size="12" fill="#6B736A" font-family="monospace">"@type": "Person", "name": "...", "jobTitle": "..."</text>
    </g>
  </g>

  <text x="300" y="460" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — E-E-A-T in practice: real author &amp; trust signals</text>
</svg>
