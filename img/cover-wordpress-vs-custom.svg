<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic comparing WordPress and a custom-built site across plugin overhead, maintenance cost and Core Web Vitals control">
  <defs>
    <linearGradient id="bgfade23" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade23)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Neither platform ranks higher by default</text>

    <!-- WordPress column -->
    <g transform="translate(80,100)">
      <rect width="480" height="450" rx="16" fill="#161B17" stroke="rgba(232,233,227,0.15)"/>
      <text x="240" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#E9EAE3">WordPress</text>
      <g font-size="12" fill="#B9BEB6">
        <rect x="24" y="60" width="432" height="42" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="40" y="86">✓ Fast content iteration, no dev needed</text>
        <rect x="24" y="112" width="432" height="42" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="40" y="138">✓ Mature plugin ecosystem for schema/sitemaps</text>
        <rect x="24" y="164" width="432" height="42" rx="8" fill="rgba(232,74,74,0.08)"/>
        <text x="40" y="190">✕ Page-builder markup bloat</text>
        <rect x="24" y="216" width="432" height="42" rx="8" fill="rgba(232,74,74,0.08)"/>
        <text x="40" y="242">✕ Plugin conflicts break canonical tags</text>
        <rect x="24" y="268" width="432" height="42" rx="8" fill="rgba(232,74,74,0.08)"/>
        <text x="40" y="294">✕ Abandoned plugins accumulate risk</text>
      </g>
      <text x="240" y="400" text-anchor="middle" font-size="11" fill="#8E978C">best for: content published weekly</text>
    </g>

    <!-- Custom column -->
    <g transform="translate(640,100)">
      <rect width="480" height="450" rx="16" fill="#161B17" stroke="rgba(203,242,74,0.3)"/>
      <text x="240" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#CBF24A">Custom-built</text>
      <g font-size="12" fill="#B9BEB6">
        <rect x="24" y="60" width="432" height="42" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="40" y="86">✓ Full Core Web Vitals control</text>
        <rect x="24" y="112" width="432" height="42" rx="8" fill="rgba(203,242,74,0.08)"/>
        <text x="40" y="138">✓ No plugin conflicts, lean markup</text>
        <rect x="24" y="164" width="432" height="42" rx="8" fill="rgba(232,74,74,0.08)"/>
        <text x="40" y="190">✕ Every feature costs dev time</text>
        <rect x="24" y="216" width="432" height="42" rx="8" fill="rgba(232,74,74,0.08)"/>
        <text x="40" y="242">✕ Sitemap/schema built &amp; maintained by hand</text>
        <rect x="24" y="268" width="432" height="42" rx="8" fill="rgba(232,74,74,0.08)"/>
        <text x="40" y="294">✕ Higher ongoing change cost</text>
      </g>
      <text x="240" y="400" text-anchor="middle" font-size="11" fill="#8E978C">best for: mostly static, speed-critical pages</text>
    </g>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — WordPress vs. a custom-built site: SEO considerations that actually matter</text>
</svg>
