<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: a YouTube video editor panel showing keyword-optimised title, description, tags and captions next to a matching search result">
  <defs>
    <linearGradient id="bgfade14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade14)"/>

  <g font-family="Archivo, sans-serif">
    <!-- video details panel -->
    <g transform="translate(80,90)">
      <rect width="560" height="470" rx="16" fill="#0E120F" stroke="rgba(232,233,227,0.12)"/>
      <rect x="0" y="0" width="560" height="34" rx="16" fill="#161B17"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/>
      <text x="280" y="22" text-anchor="middle" font-size="11" fill="#8E978C">Video details</text>

      <rect x="24" y="50" width="512" height="72" rx="10" fill="rgba(0,0,0,0.35)"/>
      <polygon points="250,68 250,104 285,86" fill="#CBF24A"/>
      <rect x="300" y="60" width="220" height="52" rx="6" fill="rgba(232,233,227,0.06)"/>

      <text x="24" y="150" font-size="11" fill="#8E978C">Title</text>
      <rect x="24" y="158" width="512" height="30" rx="6" fill="rgba(232,233,227,0.05)"/>
      <text x="34" y="178" font-size="12" fill="#E9EAE3">How to Register a Sdn Bhd in Malaysia (2026)</text>

      <text x="24" y="206" font-size="11" fill="#8E978C">Description</text>
      <rect x="24" y="214" width="512" height="60" rx="6" fill="rgba(232,233,227,0.05)"/>
      <text x="34" y="232" font-size="11" fill="#B9BEB6">Step-by-step SSM registration walkthrough —</text>
      <text x="34" y="250" font-size="11" fill="#B9BEB6">first two lines shown before "show more".</text>

      <text x="24" y="298" font-size="11" fill="#8E978C">Captions</text>
      <rect x="24" y="306" width="512" height="30" rx="6" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.2)"/>
      <text x="34" y="326" font-size="12" fill="#CBF24A">✓ Reviewed &amp; corrected — not auto-only</text>

      <rect x="24" y="352" width="512" height="90" rx="10" fill="rgba(232,233,227,0.04)"/>
      <text x="40" y="376" font-size="11" fill="#8E978C">Ranks on retention, not backlinks:</text>
      <text x="40" y="398" font-size="11" fill="#6B736A">Optimize the first 15 seconds as hard</text>
      <text x="40" y="416" font-size="11" fill="#6B736A">as the title — that's what keeps people watching.</text>
    </g>

    <!-- search result -->
    <g transform="translate(680,90)">
      <rect width="440" height="470" rx="16" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
      <text x="24" y="40" font-size="13" fill="#8E978C">Google search result</text>
      <rect x="24" y="60" width="140" height="80" rx="8" fill="rgba(232,233,227,0.08)"/>
      <polygon points="80,86 80,114 108,100" fill="#CBF24A"/>
      <text x="176" y="80" font-size="13" fill="#8ab4f8">youtube.com › watch</text>
      <text x="176" y="102" font-size="13" fill="#E9EAE3" font-weight="700">How to Register a Sdn Bhd...</text>
      <text x="176" y="124" font-size="11" fill="#8E978C">8:20 · NEXT SEO24</text>

      <g transform="translate(24,168)">
        <rect width="392" height="1" fill="rgba(232,233,227,0.12)"/>
      </g>
      <text x="24" y="200" font-size="12" fill="#8E978C">VideoObject schema, embedded on-site:</text>
      <rect x="24" y="214" width="392" height="120" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(232,233,227,0.12)"/>
      <g font-family="monospace" font-size="11" fill="#B9BEB6">
        <text x="40" y="238" fill="#7d8b6e">"@type": <tspan fill="#CBF24A">"VideoObject"</tspan>,</text>
        <text x="40" y="258" fill="#7d8b6e">"name": <tspan fill="#E9EAE3">"How to Register..."</tspan>,</text>
        <text x="40" y="278" fill="#7d8b6e">"duration": <tspan fill="#E9EAE3">"PT8M20S"</tspan>,</text>
        <text x="40" y="298" fill="#7d8b6e">"embedUrl": <tspan fill="#E9EAE3">"...watch?v=..."</tspan></text>
        <text x="40" y="318" fill="#7d8b6e">}</text>
      </g>
    </g>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — Video SEO for YouTube: a practical guide for Malaysian businesses</text>
</svg>
