<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: recovering from a Google ranking drop — a traffic graph showing a sharp fall followed by a diagnosed recovery">
  <defs>
    <linearGradient id="bgfade5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
    <linearGradient id="dropfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBF24A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#CBF24A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade5)"/>

  <g transform="translate(90,90)">
    <rect width="1020" height="470" rx="20" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
    <text x="32" y="46" font-family="Archivo, sans-serif" font-size="14" fill="#8E978C">Organic traffic — nextseo24.com/client</text>

    <!-- gridlines -->
    <g stroke="rgba(232,233,227,0.07)" stroke-width="1">
      <line x1="32" y1="120" x2="988" y2="120"/>
      <line x1="32" y1="200" x2="988" y2="200"/>
      <line x1="32" y1="280" x2="988" y2="280"/>
      <line x1="32" y1="360" x2="988" y2="360"/>
    </g>

    <!-- traffic line: rise, sharp drop, diagnosis flat, recovery rise -->
    <path d="M32 260 C120 230 200 200 280 190 L300 190 C320 340 340 380 420 385 C520 390 600 388 680 360 C760 330 840 260 900 210 C930 188 960 175 988 165"
      fill="none" stroke="#CBF24A" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 260 C120 230 200 200 280 190 L300 190 C320 340 340 380 420 385 C520 390 600 388 680 360 C760 330 840 260 900 210 C930 188 960 175 988 165 L988 420 L32 420 Z"
      fill="url(#dropfill)" opacity="0.5"/>

    <!-- drop marker -->
    <circle cx="300" cy="190" r="7" fill="#E9573F"/>
    <line x1="300" y1="190" x2="300" y2="420" stroke="#E9573F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g font-family="Archivo, sans-serif">
      <rect x="230" y="145" width="150" height="34" rx="10" fill="rgba(233,87,63,0.14)" stroke="rgba(233,87,63,0.35)"/>
      <text x="305" y="167" text-anchor="middle" font-size="13" fill="#F0B3A6" font-weight="700">Core update hit</text>
    </g>

    <!-- diagnosis marker -->
    <circle cx="420" cy="385" r="7" fill="#CBF24A"/>
    <g font-family="Archivo, sans-serif">
      <rect x="345" y="440" width="220" height="30" rx="10" fill="rgba(203,242,74,0.10)"/>
      <text x="455" y="461" text-anchor="middle" font-size="12" fill="#CBF24A">Diagnosis + fixes shipped</text>
    </g>

    <!-- recovery marker -->
    <circle cx="900" cy="210" r="7" fill="#CBF24A"/>
    <g font-family="Archivo, sans-serif">
      <rect x="800" y="150" width="180" height="34" rx="10" fill="rgba(203,242,74,0.12)" stroke="rgba(203,242,74,0.3)"/>
      <text x="890" y="172" text-anchor="middle" font-size="13" fill="#CBF24A" font-weight="700">Recovered + higher</text>
    </g>
  </g>

  <text x="90" y="615" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — recovering from a Google ranking drop, diagnosed</text>
</svg>
