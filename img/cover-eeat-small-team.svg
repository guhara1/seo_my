<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic comparing three honest author-attribution options for a small team: organization-level authorship, first-name-only attribution, and a rotating byline system">
  <defs>
    <linearGradient id="bgfade25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade25)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Honest attribution, no personal brand required</text>

    <!-- three columns -->
    <g transform="translate(80,100)">
      <rect width="330" height="440" rx="16" fill="#161B17" stroke="rgba(203,242,74,0.25)"/>
      <circle cx="165" cy="70" r="30" fill="rgba(203,242,74,0.1)" stroke="#CBF24A"/>
      <text x="165" y="78" text-anchor="middle" font-size="18" fill="#CBF24A">🏢</text>
      <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#E9EAE3">Organization</text>
      <text x="165" y="146" text-anchor="middle" font-size="11" fill="#8E978C">byline</text>
      <g font-size="11" fill="#B9BEB6">
        <rect x="24" y="170" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="192">Real address &amp; registration</text>
        <rect x="24" y="212" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="234">Genuine "About" page</text>
        <rect x="24" y="254" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="276">Google-accepted, not a workaround</text>
      </g>
    </g>

    <g transform="translate(435,100)">
      <rect width="330" height="440" rx="16" fill="#161B17" stroke="rgba(203,242,74,0.25)"/>
      <circle cx="165" cy="70" r="30" fill="rgba(203,242,74,0.1)" stroke="#CBF24A"/>
      <text x="165" y="78" text-anchor="middle" font-size="18" fill="#CBF24A">✍</text>
      <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#E9EAE3">First name</text>
      <text x="165" y="146" text-anchor="middle" font-size="11" fill="#8E978C">+ role</text>
      <g font-size="11" fill="#B9BEB6">
        <rect x="24" y="170" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="192">"Written by Wei, Web Developer"</text>
        <rect x="24" y="212" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="234">No public profile required</text>
        <rect x="24" y="254" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="276">Honest and specific</text>
      </g>
    </g>

    <g transform="translate(790,100)">
      <rect width="330" height="440" rx="16" fill="#161B17" stroke="rgba(203,242,74,0.25)"/>
      <circle cx="165" cy="70" r="30" fill="rgba(203,242,74,0.1)" stroke="#CBF24A"/>
      <text x="165" y="78" text-anchor="middle" font-size="18" fill="#CBF24A">🔄</text>
      <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#E9EAE3">Rotating</text>
      <text x="165" y="146" text-anchor="middle" font-size="11" fill="#8E978C">byline system</text>
      <g font-size="11" fill="#B9BEB6">
        <rect x="24" y="170" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="192">Writer credited per topic</text>
        <rect x="24" y="212" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="234">"Reviewed by" senior/owner</text>
        <rect x="24" y="254" width="282" height="34" rx="8" fill="rgba(232,233,227,0.05)"/><text x="40" y="276">Reflects how content is really made</text>
      </g>
    </g>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — E-E-A-T without a personal brand: practical options for small teams</text>
</svg>
