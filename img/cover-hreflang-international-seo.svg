<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: hreflang tags connecting the English, Korean, Japanese and Thai versions of one page, each self-referencing and cross-referencing correctly">
  <defs>
    <linearGradient id="bgfade17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade17)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">One page, four correctly linked language versions</text>

    <!-- connecting lines forming a fully-connected mesh -->
    <g stroke="rgba(203,242,74,0.3)" stroke-width="1.5" fill="none">
      <line x1="260" y1="200" x2="600" y2="140"/>
      <line x1="260" y1="200" x2="940" y2="200"/>
      <line x1="260" y1="200" x2="600" y2="480"/>
      <line x1="600" y1="140" x2="940" y2="200"/>
      <line x1="600" y1="140" x2="600" y2="480"/>
      <line x1="940" y1="200" x2="600" y2="480"/>
    </g>

    <!-- self-reference loops -->
    <g stroke="#CBF24A" stroke-width="1.5" fill="none">
      <circle cx="260" cy="200" r="14" stroke-dasharray="3,2"/>
      <circle cx="600" cy="140" r="14" stroke-dasharray="3,2"/>
      <circle cx="940" cy="200" r="14" stroke-dasharray="3,2"/>
      <circle cx="600" cy="480" r="14" stroke-dasharray="3,2"/>
    </g>

    <g font-size="13" fill="#E9EAE3" text-anchor="middle">
      <g transform="translate(260,200)"><circle r="34" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-6" font-weight="700">EN</text><text y="12" font-size="10" fill="#8E978C">/en/</text></g>
      <g transform="translate(600,140)"><circle r="34" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-6" font-weight="700">KO</text><text y="12" font-size="10" fill="#8E978C">/ko/</text></g>
      <g transform="translate(940,200)"><circle r="34" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-6" font-weight="700">JA</text><text y="12" font-size="10" fill="#8E978C">/ja/</text></g>
      <g transform="translate(600,480)"><circle r="34" fill="#161B17" stroke="rgba(232,233,227,0.2)"/><text y="-6" font-weight="700">TH</text><text y="12" font-size="10" fill="#8E978C">/th/</text></g>
    </g>

    <g transform="translate(430,540)">
      <rect width="340" height="70" rx="10" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.25)"/>
      <text x="170" y="28" text-anchor="middle" font-size="12" fill="#CBF24A" font-weight="700">Dashed loop = self-reference</text>
      <text x="170" y="48" text-anchor="middle" font-size="11" fill="#8E978C">the tag almost everyone forgets</text>
    </g>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — International SEO &amp; hreflang across Malaysia, Korea, Japan and Southeast Asia</text>
</svg>
