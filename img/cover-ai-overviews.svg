<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: Google AI Overviews in 2026 — a search results page with an AI-generated answer box citing sources">
  <defs>
    <linearGradient id="bgfade2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBF24A"/>
      <stop offset="1" stop-color="#8FE23A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade2)"/>

  <!-- browser mockup -->
  <g transform="translate(120,70)">
    <rect width="960" height="535" rx="20" fill="#0E120F" stroke="rgba(232,233,227,0.12)"/>
    <path d="M0 20a20 20 0 0 1 20-20h920a20 20 0 0 1 20 20v40H0z" fill="#161B17"/>
    <circle cx="30" cy="30" r="7" fill="#ff5f56"/>
    <circle cx="54" cy="30" r="7" fill="#ffbd2e"/>
    <circle cx="78" cy="30" r="7" fill="#27c93f"/>
    <rect x="120" y="17" width="500" height="26" rx="13" fill="rgba(255,255,255,0.06)"/>
    <text x="140" y="35" font-family="Archivo, sans-serif" font-size="14" fill="#8E978C">google.com/search?q=best+seo+agency+malaysia</text>

    <!-- AI overview box -->
    <g transform="translate(40,90)">
      <rect width="880" height="230" rx="16" fill="rgba(203,242,74,0.07)" stroke="rgba(203,242,74,0.30)"/>
      <g transform="translate(24,24)">
        <path d="M14 0 L18 10 L28 14 L18 18 L14 28 L10 18 L0 14 L10 10 Z" fill="url(#sparkle)"/>
        <text x="34" y="20" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#CBF24A">AI Overview</text>
      </g>
      <g font-family="Archivo, sans-serif" font-size="15" fill="#C7CAC2">
        <rect x="24" y="56" width="820" height="14" rx="7" fill="rgba(232,233,227,0.14)"/>
        <rect x="24" y="82" width="780" height="14" rx="7" fill="rgba(232,233,227,0.14)"/>
        <rect x="24" y="108" width="700" height="14" rx="7" fill="rgba(232,233,227,0.14)"/>
      </g>
      <!-- citation chips -->
      <g transform="translate(24,146)" font-family="Archivo, sans-serif" font-size="12" fill="#0B0D0C">
        <rect x="0" y="0" width="150" height="30" rx="15" fill="#CBF24A"/>
        <text x="75" y="20" text-anchor="middle" font-weight="700">nextseo24.com</text>
        <rect x="164" y="0" width="120" height="30" rx="15" fill="rgba(232,233,227,0.12)"/>
        <text x="224" y="20" text-anchor="middle" fill="#B9BEB6">source 2</text>
        <rect x="298" y="0" width="120" height="30" rx="15" fill="rgba(232,233,227,0.12)"/>
        <text x="358" y="20" text-anchor="middle" fill="#B9BEB6">source 3</text>
      </g>
    </g>

    <!-- organic results below -->
    <g transform="translate(40,344)" font-family="Archivo, sans-serif">
      <text x="0" y="16" font-size="13" fill="#6B736A">1. nextseo24.com — Google SEO Ranking Agency, Kuala Lumpur</text>
      <rect x="0" y="30" width="640" height="10" rx="5" fill="rgba(232,233,227,0.08)"/>
      <text x="0" y="76" font-size="13" fill="#6B736A">2. competitor-a.com — SEO services Malaysia</text>
      <rect x="0" y="90" width="560" height="10" rx="5" fill="rgba(232,233,227,0.08)"/>
      <text x="0" y="136" font-size="13" fill="#6B736A">3. competitor-b.com — Digital marketing KL</text>
      <rect x="0" y="150" width="600" height="10" rx="5" fill="rgba(232,233,227,0.08)"/>
    </g>
  </g>

  <text x="120" y="655" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — Google AI Overviews &amp; generative search optimization</text>
