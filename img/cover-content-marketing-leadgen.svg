<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: content mapped to the three stages of a buyer's decision — problem-aware, solution-aware, vendor-aware">
  <defs>
    <linearGradient id="bgfade13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade13)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Content mapped to how buyers actually decide</text>

    <!-- funnel: three stacked trapezoids narrowing -->
    <g transform="translate(190,110)">
      <polygon points="0,0 820,0 700,110 120,110" fill="rgba(232,233,227,0.06)" stroke="rgba(232,233,227,0.15)"/>
      <text x="410" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#E9EAE3">Problem-aware</text>
      <text x="410" y="72" text-anchor="middle" font-size="12" fill="#8E978C">"Why isn't my website getting traffic"</text>
      <text x="410" y="94" text-anchor="middle" font-size="11" fill="#6B736A">broad, diagnostic — highest volume</text>

      <polygon points="120,130 700,130 610,240 210,240" fill="rgba(232,233,227,0.08)" stroke="rgba(232,233,227,0.18)"/>
      <text x="410" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#E9EAE3">Solution-aware</text>
      <text x="410" y="202" text-anchor="middle" font-size="12" fill="#8E978C">comparing "SEO" vs "ads" vs agencies</text>
      <text x="410" y="224" text-anchor="middle" font-size="11" fill="#6B736A">honest, method-focused content</text>

      <polygon points="210,260 610,260 550,370 270,370" fill="rgba(203,242,74,0.12)" stroke="rgba(203,242,74,0.35)"/>
      <text x="410" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#CBF24A">Vendor-aware</text>
      <text x="410" y="332" text-anchor="middle" font-size="12" fill="#B9BEB6">evaluating specific providers</text>
      <text x="410" y="354" text-anchor="middle" font-size="11" fill="#8E978C">pricing, case studies — where leads convert</text>
    </g>

    <text x="600" y="560" text-anchor="middle" font-size="13" fill="#6B736A">Most SME blogs are stacked with the top layer — and thin at the bottom, where enquiries actually happen.</text>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — Content marketing &amp; blog strategy for lead generation</text>
</svg>
