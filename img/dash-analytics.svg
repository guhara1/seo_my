<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="Web analytics overview — illustrative example">
  <rect width="760" height="460" rx="18" fill="#0E120F"/>
  <rect x="0.5" y="0.5" width="759" height="459" rx="18" fill="none" stroke="rgba(232,233,227,0.12)"/>
  <path d="M0 18a18 18 0 0 1 18-18h724a18 18 0 0 1 18 18v38H0z" fill="#161B17"/>
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/><circle cx="50" cy="28" r="6" fill="#ffbd2e"/><circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <rect x="110" y="17" width="300" height="22" rx="11" fill="rgba(255,255,255,0.06)"/>
  <text x="128" y="32" font-family="Archivo,sans-serif" font-size="13" fill="#8E978C">Analytics · Overview</text>

  <!-- stat tiles -->
  <g font-family="Archivo,sans-serif">
    <rect x="40" y="76" width="214" height="84" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(232,233,227,0.10)"/>
    <text x="58" y="106" font-size="13" fill="#8E978C">Users</text><text x="58" y="140" font-family="Bricolage Grotesque,Archivo,sans-serif" font-weight="800" font-size="28" fill="#E9EAE3">9,840</text>
    <rect x="273" y="76" width="214" height="84" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(232,233,227,0.10)"/>
    <text x="291" y="106" font-size="13" fill="#8E978C">Sessions</text><text x="291" y="140" font-family="Bricolage Grotesque,Archivo,sans-serif" font-weight="800" font-size="28" fill="#E9EAE3">14.2k</text>
    <rect x="506" y="76" width="214" height="84" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(232,233,227,0.10)"/>
    <text x="524" y="106" font-size="13" fill="#8E978C">Conv. rate</text><text x="524" y="140" font-family="Bricolage Grotesque,Archivo,sans-serif" font-weight="800" font-size="28" fill="#CBF24A">3.6%</text>
  </g>

  <text x="40" y="196" font-family="Archivo,sans-serif" font-size="14" fill="#8E978C">Monthly organic sessions</text>

  <!-- bars -->
  <g>
    <rect x="56"  y="356" width="56" height="44"  rx="6" fill="rgba(255,255,255,0.08)"/>
    <rect x="152" y="350" width="56" height="50"  rx="6" fill="rgba(255,255,255,0.08)"/>
    <rect x="248" y="338" width="56" height="62"  rx="6" fill="rgba(255,255,255,0.08)"/>
    <rect x="344" y="316" width="56" height="84"  rx="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="440" y="286" width="56" height="114" rx="6" fill="rgba(203,242,74,0.45)"/>
    <rect x="536" y="244" width="56" height="156" rx="6" fill="#A8D62B"/>
    <rect x="632" y="200" width="56" height="200" rx="6" fill="#CBF24A"/>
  </g>
  <g font-family="Archivo,sans-serif" font-size="12" fill="#6B736A" text-anchor="middle">
    <text x="84" y="420">M1</text><text x="180" y="420">M2</text><text x="276" y="420">M3</text><text x="372" y="420">M4</text><text x="468" y="420">M5</text><text x="564" y="420">M6</text><text x="660" y="420">M7</text>
  </g>
  <text x="720" y="446" text-anchor="end" font-family="Archivo,sans-serif" font-size="11" fill="#525a4d">Illustrative example</text>
</svg>
