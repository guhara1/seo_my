<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic comparing a desktop page with a section, links and schema present against the mobile version where that same content silently disappears">
  <defs>
    <linearGradient id="bgfade22" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade22)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Google ranks what's on mobile — not what's on desktop</text>

    <!-- desktop mockup -->
    <g transform="translate(80,90)">
      <rect width="480" height="440" rx="14" fill="#161B17" stroke="rgba(232,233,227,0.15)"/>
      <text x="240" y="34" text-anchor="middle" font-size="13" fill="#8E978C">Desktop page</text>
      <rect x="20" y="50" width="440" height="40" rx="6" fill="rgba(232,233,227,0.06)"/>
      <rect x="20" y="102" width="270" height="80" rx="6" fill="rgba(232,233,227,0.06)"/>
      <rect x="300" y="102" width="160" height="80" rx="6" fill="rgba(203,242,74,0.1)" stroke="rgba(203,242,74,0.25)"/>
      <text x="380" y="146" text-anchor="middle" font-size="10" fill="#CBF24A">sidebar content</text>
      <rect x="20" y="194" width="440" height="30" rx="6" fill="rgba(203,242,74,0.1)" stroke="rgba(203,242,74,0.25)"/>
      <text x="240" y="214" text-anchor="middle" font-size="10" fill="#CBF24A">JSON-LD schema present</text>
      <rect x="20" y="236" width="440" height="180" rx="6" fill="rgba(232,233,227,0.04)"/>
      <text x="30" y="256" font-size="10" fill="#6B736A">body content...</text>
    </g>

    <!-- arrow -->
    <g stroke="rgba(232,74,74,0.4)" stroke-width="2" fill="none">
      <line x1="590" y1="300" x2="660" y2="300"/>
      <polygon points="652,292 652,308 668,300" fill="rgba(232,74,74,0.4)"/>
    </g>
    <text x="625" y="280" text-anchor="middle" font-size="11" fill="#E88484">quietly dropped</text>

    <!-- mobile mockup -->
    <g transform="translate(700,90)">
      <rect width="230" height="440" rx="20" fill="#161B17" stroke="rgba(232,74,74,0.3)"/>
      <text x="115" y="34" text-anchor="middle" font-size="13" fill="#8E978C">Mobile page</text>
      <rect x="16" y="50" width="198" height="34" rx="6" fill="rgba(232,233,227,0.06)"/>
      <rect x="16" y="96" width="198" height="70" rx="6" fill="rgba(232,233,227,0.06)"/>
      <text x="115" y="135" text-anchor="middle" font-size="9" fill="#6B736A">(sidebar removed)</text>
      <rect x="16" y="178" width="198" height="150" rx="6" fill="rgba(232,233,227,0.04)"/>
      <text x="26" y="198" font-size="9" fill="#6B736A">body content...</text>
      <rect x="16" y="342" width="198" height="26" rx="6" fill="rgba(232,74,74,0.1)" stroke="rgba(232,74,74,0.3)"/>
      <text x="115" y="359" text-anchor="middle" font-size="9" fill="#E88484">no schema markup</text>
    </g>

    <text x="600" y="580" text-anchor="middle" font-size="12.5" fill="#6B736A">If it's not in the mobile HTML, it's not part of Google's ranking evaluation.</text>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — Mobile-first indexing: the checklist most sites get wrong</text>
</svg>
