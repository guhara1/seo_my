<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: why isn't my website ranking on Google — a diagnostic checklist with passed and failed technical SEO checks">
  <defs>
    <linearGradient id="bgfade3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade3)"/>

  <!-- diagnostic card -->
  <g transform="translate(340,60)">
    <rect width="520" height="555" rx="20" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
    <text x="28" y="48" font-family="Archivo, sans-serif" font-size="14" fill="#8E978C">SEO diagnostic — nextseo24.com</text>
    <line x1="0" y1="66" x2="520" y2="66" stroke="rgba(232,233,227,0.10)"/>

    <g font-family="Archivo, sans-serif" font-size="17" fill="#E9EAE3">
      <!-- passed items -->
      <g transform="translate(28,100)">
        <circle cx="12" cy="0" r="12" fill="#CBF24A"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✓</text>
        <text x="34" y="6">Indexed in Google Search Console</text>
      </g>
      <g transform="translate(28,148)">
        <circle cx="12" cy="0" r="12" fill="#CBF24A"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✓</text>
        <text x="34" y="6">HTTPS &amp; mobile-friendly</text>
      </g>
      <!-- failed items -->
      <g transform="translate(28,196)">
        <circle cx="12" cy="0" r="12" fill="#E9573F"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✕</text>
        <text x="34" y="6" fill="#F0B3A6">No target keyword in title tag</text>
      </g>
      <g transform="translate(28,244)">
        <circle cx="12" cy="0" r="12" fill="#E9573F"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✕</text>
        <text x="34" y="6" fill="#F0B3A6">LCP 4.8s — too slow</text>
      </g>
      <g transform="translate(28,292)">
        <circle cx="12" cy="0" r="12" fill="#E9573F"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✕</text>
        <text x="34" y="6" fill="#F0B3A6">0 referring domains</text>
      </g>
      <g transform="translate(28,340)">
        <circle cx="12" cy="0" r="12" fill="#CBF24A"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✓</text>
        <text x="34" y="6">No manual action in GSC</text>
      </g>
      <g transform="translate(28,388)">
        <circle cx="12" cy="0" r="12" fill="#E9573F"/>
        <text x="8" y="5" text-anchor="middle" font-weight="800" font-size="14" fill="#0B0D0C">✕</text>
        <text x="34" y="6" fill="#F0B3A6">Thin content — 180 words</text>
      </g>
    </g>

    <rect x="28" y="440" width="464" height="70" rx="14" fill="rgba(233,87,63,0.10)" stroke="rgba(233,87,63,0.30)"/>
    <text x="52" y="470" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#F0B3A6">4 of 7 checks failed</text>
    <text x="52" y="492" font-family="Archivo, sans-serif" font-size="13" fill="#C7A79E">Fixable — see the 12-point checklist</text>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(170,150)" opacity="0.9">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#CBF24A" stroke-width="10"/>
    <line x1="50" y1="50" x2="105" y2="105" stroke="#CBF24A" stroke-width="14" stroke-linecap="round"/>
  </g>

  <text x="120" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — why your website isn't ranking, diagnosed</text>
</svg>
