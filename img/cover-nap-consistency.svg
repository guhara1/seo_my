<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic showing the same business listed with three different addresses and phone numbers across directories, versus one consistent NAP everywhere">
  <defs>
    <linearGradient id="bgfade20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade20)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Same business, three different stories</text>

    <!-- inconsistent row -->
    <g transform="translate(80,95)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#E88484">✕ INCONSISTENT — confuses Google's verification</text>
      <g font-size="11.5" fill="#B9BEB6">
        <rect x="0" y="18" width="330" height="70" rx="10" fill="rgba(232,74,74,0.08)" stroke="rgba(232,74,74,0.2)"/>
        <text x="16" y="40">Google Business Profile</text>
        <text x="16" y="60" fill="#E88484">12 Jalan Ampang, KL · 03-2141 XXXX</text>

        <rect x="360" y="18" width="330" height="70" rx="10" fill="rgba(232,74,74,0.08)" stroke="rgba(232,74,74,0.2)"/>
        <text x="376" y="40">Old directory listing</text>
        <text x="376" y="60" fill="#E88484">Lot 5, Jalan Bukit Bintang · 03-2144 YYYY</text>

        <rect x="720" y="18" width="330" height="70" rx="10" fill="rgba(232,74,74,0.08)" stroke="rgba(232,74,74,0.2)"/>
        <text x="736" y="40">Facebook Page</text>
        <text x="736" y="60" fill="#E88484">"ABC Marketing" (no Sdn Bhd)</text>
      </g>
    </g>

    <!-- arrow down -->
    <g transform="translate(600,215)" stroke="rgba(203,242,74,0.4)" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="50"/>
      <polygon points="-8,42 8,42 0,58" fill="rgba(203,242,74,0.4)"/>
    </g>
    <text x="600" y="300" text-anchor="middle" font-size="12" fill="#8E978C">fixed to one consistent NAP everywhere</text>

    <!-- consistent row -->
    <g transform="translate(80,330)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#CBF24A">✓ CONSISTENT — Google can verify with confidence</text>
      <g font-size="11.5" fill="#B9BEB6">
        <rect x="0" y="18" width="330" height="70" rx="10" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.3)"/>
        <text x="16" y="40">Google Business Profile</text>
        <text x="16" y="60" fill="#CBF24A">12 Jalan Ampang, KL · 03-2141 XXXX</text>

        <rect x="360" y="18" width="330" height="70" rx="10" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.3)"/>
        <text x="376" y="40">Directory listing</text>
        <text x="376" y="60" fill="#CBF24A">12 Jalan Ampang, KL · 03-2141 XXXX</text>

        <rect x="720" y="18" width="330" height="70" rx="10" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.3)"/>
        <text x="736" y="40">Facebook Page</text>
        <text x="736" y="60" fill="#CBF24A">ABC Marketing Sdn Bhd</text>
      </g>
    </g>

    <text x="600" y="470" text-anchor="middle" font-size="12.5" fill="#6B736A">Citations aren't backlinks — their value is consistency Google can verify.</text>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — Local citations &amp; NAP consistency: the quiet local SEO killer</text>
</svg>
