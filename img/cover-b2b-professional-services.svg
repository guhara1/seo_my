<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic comparing a fast, high-volume e-commerce SEO funnel against a slower, trust-driven B2B professional-services SEO funnel">
  <defs>
    <linearGradient id="bgfade11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade11)"/>

  <g font-family="Archivo, sans-serif">
    <text x="600" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#E9EAE3">Two very different SEO funnels</text>

    <!-- left: e-commerce -->
    <g transform="translate(80,110)">
      <rect width="480" height="480" rx="16" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
      <text x="240" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#8E978C">E-COMMERCE</text>
      <g font-size="12.5" fill="#B9BEB6">
        <rect x="30" y="70" width="420" height="52" rx="10" fill="rgba(232,233,227,0.05)"/>
        <text x="48" y="92">High search volume</text>
        <text x="48" y="110" fill="#6B736A">thousands of searches / month</text>

        <rect x="30" y="132" width="420" height="52" rx="10" fill="rgba(232,233,227,0.05)"/>
        <text x="48" y="154">Fast decision</text>
        <text x="48" y="172" fill="#6B736A">converts in minutes</text>

        <rect x="30" y="194" width="420" height="52" rx="10" fill="rgba(232,233,227,0.05)"/>
        <text x="48" y="216">Self-serve checkout</text>
        <text x="48" y="234" fill="#6B736A">no human contact needed</text>

        <rect x="30" y="256" width="420" height="52" rx="10" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.2)"/>
        <text x="48" y="278" fill="#CBF24A" font-weight="700">3-6 months to results</text>
        <text x="48" y="296" fill="#8E978C">many competing pages, high volume</text>
      </g>
      <text x="240" y="420" text-anchor="middle" font-size="34" fill="rgba(232,233,227,0.15)">🛒</text>
    </g>

    <!-- right: B2B professional services -->
    <g transform="translate(640,110)">
      <rect width="480" height="480" rx="16" fill="#161B17" stroke="rgba(203,242,74,0.25)"/>
      <text x="240" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#CBF24A">B2B PROFESSIONAL SERVICES</text>
      <g font-size="12.5" fill="#B9BEB6">
        <rect x="30" y="70" width="420" height="52" rx="10" fill="rgba(232,233,227,0.05)"/>
        <text x="48" y="92">Low search volume</text>
        <text x="48" y="110" fill="#6B736A">dozens of searches / month, high intent</text>

        <rect x="30" y="132" width="420" height="52" rx="10" fill="rgba(232,233,227,0.05)"/>
        <text x="48" y="154">Slow decision</text>
        <text x="48" y="172" fill="#6B736A">weeks or months of research</text>

        <rect x="30" y="194" width="420" height="52" rx="10" fill="rgba(232,233,227,0.05)"/>
        <text x="48" y="216">Human contact required</text>
        <text x="48" y="234" fill="#6B736A">closes on a call, not a cart</text>

        <rect x="30" y="256" width="420" height="52" rx="10" fill="rgba(203,242,74,0.08)" stroke="rgba(203,242,74,0.2)"/>
        <text x="48" y="278" fill="#CBF24A" font-weight="700">6-12 months to results</text>
        <text x="48" y="296" fill="#8E978C">thinner competition once ranked</text>
      </g>
      <text x="240" y="420" text-anchor="middle" font-size="34" fill="rgba(203,242,74,0.2)">⚖</text>
    </g>
  </g>

  <text x="80" y="640" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — B2B SEO for law firms, accountants &amp; consultants in Malaysia</text>
</svg>
