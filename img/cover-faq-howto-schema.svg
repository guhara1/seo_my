<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Infographic: FAQ and HowTo structured data implementation — a code editor showing JSON-LD next to the rendered rich result">
  <defs>
    <linearGradient id="bgfade9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B17"/>
      <stop offset="1" stop-color="#0B0D0C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgfade9)"/>

  <g font-family="Archivo, sans-serif">
    <!-- code editor -->
    <g transform="translate(80,90)">
      <rect width="560" height="470" rx="16" fill="#0E120F" stroke="rgba(232,233,227,0.12)"/>
      <rect x="0" y="0" width="560" height="34" rx="16" fill="#161B17"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/>
      <text x="280" y="22" text-anchor="middle" font-size="11" fill="#8E978C">faq-schema.json</text>
      <g font-family="monospace" font-size="12.5" fill="#B9BEB6">
        <text x="20" y="66" fill="#7d8b6e">"@type": <tspan fill="#CBF24A">"FAQPage"</tspan>,</text>
        <text x="20" y="90" fill="#7d8b6e">"mainEntity": [{</text>
        <text x="40" y="114" fill="#7d8b6e">"@type": <tspan fill="#CBF24A">"Question"</tspan>,</text>
        <text x="40" y="138" fill="#7d8b6e">"name": <tspan fill="#E9EAE3">"How long does...?"</tspan>,</text>
        <text x="40" y="162" fill="#7d8b6e">"acceptedAnswer": {</text>
        <text x="60" y="186" fill="#7d8b6e">"@type": <tspan fill="#CBF24A">"Answer"</tspan>,</text>
        <text x="60" y="210" fill="#7d8b6e">"text": <tspan fill="#E9EAE3">"Typically 3-6..."</tspan></text>
        <text x="40" y="234" fill="#7d8b6e">}</text>
        <text x="20" y="258" fill="#7d8b6e">}]</text>
      </g>
      <rect x="20" y="290" width="520" height="150" rx="10" fill="rgba(203,242,74,0.06)" stroke="rgba(203,242,74,0.2)"/>
      <text x="40" y="316" font-size="11" fill="#8E978C" font-family="Archivo, sans-serif">Validate before you publish:</text>
      <text x="40" y="342" font-size="12.5" fill="#CBF24A" font-family="monospace">search.google.com/test/rich-results</text>
      <text x="40" y="368" font-size="11" fill="#6B736A" font-family="Archivo, sans-serif">Only mark up content visible on the page —</text>
      <text x="40" y="388" font-size="11" fill="#6B736A" font-family="Archivo, sans-serif">hidden or mismatched schema gets ignored,</text>
      <text x="40" y="408" font-size="11" fill="#6B736A" font-family="Archivo, sans-serif">or worse, manually actioned.</text>
    </g>

    <!-- rendered result -->
    <g transform="translate(680,90)">
      <rect width="440" height="470" rx="16" fill="#161B17" stroke="rgba(232,233,227,0.12)"/>
      <text x="24" y="40" font-size="13" fill="#8E978C">Google search result</text>
      <text x="24" y="70" font-size="16" fill="#8ab4f8">nextseo24.com › magazine</text>
      <text x="24" y="98" font-size="15" fill="#E9EAE3" font-weight="700">How long does SEO take to work?</text>
      <g transform="translate(24,116)">
        <rect width="392" height="1" fill="rgba(232,233,227,0.12)"/>
      </g>
      <g transform="translate(24,132)" font-size="13" fill="#B9BEB6">
        <text y="0">▾ How long does SEO take to work?</text>
        <text y="24" fill="#8E978C">Typically 3-6 months for meaningful...</text>
        <text y="56">▾ Why is SEO cheaper than Ads over time?</text>
        <text y="80" fill="#8E978C">With Google Ads you pay for every...</text>
        <text y="112">▾ Do you offer fixed pricing?</text>
        <text y="136" fill="#8E978C">Yes. NEXT SEO24 publishes...</text>
      </g>
      <g transform="translate(24,300)">
        <rect width="392" height="34" rx="10" fill="rgba(203,242,74,0.12)" stroke="rgba(203,242,74,0.3)"/>
        <text x="196" y="22" text-anchor="middle" font-size="12" fill="#CBF24A" font-weight="700">Extra results space, no extra ranking</text>
      </g>
    </g>
  </g>

  <text x="80" y="600" font-family="Archivo, sans-serif" font-size="13" fill="#4f564e">NEXT SEO24 — FAQ &amp; HowTo schema: a hands-on implementation guide</text>
</svg>
